name: Aggiorna profile README

on:
  schedule:
    - cron: "0 */6 * * *"   # ogni 6 ore
  workflow_dispatch:         # avvio manuale dalla tab Actions

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera README e card neofetch
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'PYEOF'
          """Profile README generator: PR pubbliche, statistiche e card neofetch in SVG."""
          import json, os, re, time, urllib.request, urllib.error, urllib.parse
          from collections import Counter
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape as xesc

          USER = os.environ["GH_USER"]
          TOKEN = os.environ.get("GH_TOKEN", "")
          README, ASSETS = "README.md", "assets"
          CACHE = f"{ASSETS}/pr-cache-v2.json"
          START, END = "<!-- AUTO:START -->", "<!-- AUTO:END -->"
          MERGE_BOTS = {"robodoo", "OCA-git-bot", "bors[bot]", "mergify[bot]"}
          NOW = datetime.now(timezone.utc)
          API = "https://api.github.com"

          KINDS = {"FIX": "🐛", "IMP": "✨", "ADD": "➕", "MIG": "🚚", "PERF": "⚡", "REF": "♻️",
                   "REM": "🔥", "MOV": "📦", "REV": "⏪", "I18N": "🌍", "FEAT": "✨", "DOCS": "📚",
                   "TEST": "🧪", "CHORE": "🔧", "UPD": "⬆️", "BUILD": "🏗️", "CI": "🤖"}
          CONV = {"feat": "FEAT", "fix": "FIX", "perf": "PERF", "refactor": "REF", "docs": "DOCS",
                  "test": "TEST", "chore": "CHORE", "build": "BUILD", "ci": "CI", "revert": "REV"}

          # Tokyo Night
          C = dict(bg="#1a1b26", bar="#16161e", fg="#c0caf5", mut="#565f89", cyan="#7dcfff",
                   blue="#7aa2f7", purple="#bb9af7", green="#9ece6a", yellow="#e0af68",
                   red="#f7768e", orange="#ff9e64")


          def api(url, auth=True, data=None, tries=4, wait=20):
              h = {"Accept": "application/vnd.github+json", "User-Agent": "profile-readme"}
              if auth and TOKEN:
                  h["Authorization"] = f"Bearer {TOKEN}"
              body = json.dumps(data).encode() if data is not None else None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, data=body, headers=h)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 429) and i < tries - 1:
                          time.sleep(wait * (i + 1))
                          continue
                      raise


          def dt(s):
              return datetime.fromisoformat(s.replace("Z", "+00:00"))


          def days(s):
              return (NOW - dt(s)).days


          def ago(s):
              d = days(s)
              return "oggi" if d == 0 else "ieri" if d == 1 else f"{d}g fa" if d < 60 else f"{d // 30}m fa"


          # ---------------------------------------------------------------- dati
          def search_prs():
              # Ricerca NON autenticata: il GITHUB_TOKEN limiterebbe i risultati a questo repo.
              items, q = [], urllib.parse.quote(f"author:{USER} is:pr is:public")
              for page in range(1, 11):
                  d = api(f"{API}/search/issues?q={q}&sort=created&order=desc&per_page=100&page={page}", auth=False)
                  items += d["items"]
                  if not d["items"] or len(items) >= min(d["total_count"], 1000):
                      break
                  time.sleep(4)
              return items


          def parse(i):
              title = i["title"]
              tags = re.findall(r"\[([^\]]+)\]", title)
              kind = next((t.upper() for t in tags if t.upper() in KINDS), None)
              m = re.match(r"^(\w+)(\(.+?\))?!?:", title)
              if not kind and m and m.group(1).lower() in CONV:
                  kind = CONV[m.group(1).lower()]
              labels = [l["name"] for l in i.get("labels", [])]
              ver = next((t for t in tags if re.fullmatch(r"\d+\.\d+", t)), None) or \
                  next((l for l in labels if re.fullmatch(r"\d+\.\d+", l)), None)
              clean = re.sub(r"\[[^\]]*\]\s*", "", title).strip() or title
              merged = i["pull_request"].get("merged_at")
              via = None
              if not merged and i["state"] == "closed" and any(l.lower().startswith("merged") for l in labels):
                  merged, via = i["closed_at"], "bot"
              return dict(node_id=i["node_id"], branch=None, repo=i["repository_url"].split("/repos/")[1], number=i["number"], url=i["html_url"],
                          title=clean, kind=kind, ver=ver, state=i["state"], draft=i.get("draft", False),
                          created=i["created_at"], merged=merged, via=via)


          def closed_by_merge(p):
              """Rileva merge fatti da bot (es. robodoo su odoo/odoo) che chiudono la PR via commit."""
              try:
                  for page in (1, 2, 3):
                      ev = api(f"{API}/repos/{p['repo']}/issues/{p['number']}/events?per_page=100&page={page}",
                               tries=2, wait=5)
                      for e in ev:
                          actor = (e.get("actor") or {}).get("login")
                          if e["event"] == "closed" and (e.get("commit_id") or actor in MERGE_BOTS):
                              return e["created_at"]
                      if len(ev) < 100:
                          break
                  return ""
              except Exception as ex:
                  print("warn:", p["url"], ex)
                  return None  # non salvare in cache, riprova al prossimo giro


          GQL_PRS = """query($ids:[ID!]!){nodes(ids:$ids){... on PullRequest{url baseRefName mergedAt
            timelineItems(itemTypes:[CLOSED_EVENT],last:1){nodes{... on ClosedEvent{createdAt actor{login} closer{__typename}}}}}}}"""


          def gql_info(chunk):
              """Branch target + merge via bot per 50 PR in una sola chiamata GraphQL."""
              d = api(f"{API}/graphql", data={"query": GQL_PRS, "variables": {"ids": [p["node_id"] for p in chunk]}},
                      tries=2, wait=5)
              if not d.get("data"):
                  raise RuntimeError(d.get("errors"))
              out = {}
              for n in d["data"]["nodes"] or []:
                  if not n or "url" not in n:
                      continue
                  merged = n["mergedAt"]
                  ev = (n["timelineItems"]["nodes"] or [None])[-1]
                  if not merged and ev and ((ev.get("closer") or {}).get("__typename") == "Commit"
                                            or (ev.get("actor") or {}).get("login") in MERGE_BOTS):
                      merged = ev["createdAt"]
                  out[n["url"]] = {"base": n["baseRefName"], "merged": merged or ""}
              return out


          def rest_info(p):
              """Fallback REST, una PR alla volta."""
              try:
                  pr = api(f"{API}/repos/{p['repo']}/pulls/{p['number']}", tries=2, wait=5)
              except Exception as ex:
                  print("warn:", p["url"], ex)
                  return None
              merged = pr.get("merged_at") or ""
              if not merged and pr["state"] == "closed":
                  m = closed_by_merge(p)
                  if m is None:
                      return None
                  merged = m
              return {"base": pr["base"]["ref"], "merged": merged}


          def enrich(prs):
              try:
                  cache = json.load(open(CACHE))
              except Exception:
                  cache = {}
              todo = [p for p in prs if p["state"] == "open" or p["url"] not in cache]
              info = {}
              for k in range(0, len(todo), 50):
                  try:
                      info.update(gql_info(todo[k:k + 50]))
                  except Exception as ex:
                      print("warn: graphql PR", ex)
                      break
              fails = 0
              for p in todo:
                  if p["url"] in info or fails >= 3:
                      continue
                  r = rest_info(p)
                  if r is None:
                      fails += 1
                  else:
                      info[p["url"]] = r
              for p in prs:
                  r = info.get(p["url"]) or cache.get(p["url"])
                  if not r:
                      continue
                  if p["state"] != "open":  # PR chiuse: dati definitivi, vanno in cache
                      cache[p["url"]] = r
                  p["branch"] = r["base"]
                  if not p["merged"] and p["state"] == "closed" and r["merged"]:
                      p["merged"], p["via"] = r["merged"], "bot"
              os.makedirs(ASSETS, exist_ok=True)
              json.dump(cache, open(CACHE, "w"), indent=0, sort_keys=True)


          def profile():
              q = """query($l:String!){user(login:$l){followers{totalCount}
                repositories(ownerAffiliations:OWNER,privacy:PUBLIC,isFork:false,first:100){totalCount nodes{stargazerCount}}
                contributionsCollection{totalCommitContributions totalPullRequestReviewContributions
                contributionCalendar{totalContributions}}}}"""
              try:
                  u = api(f"{API}/graphql", data={"query": q, "variables": {"l": USER}}, tries=2, wait=5)["data"]["user"]
                  c = u["contributionsCollection"]
                  return dict(followers=u["followers"]["totalCount"], repos=u["repositories"]["totalCount"],
                              stars=sum(r["stargazerCount"] for r in u["repositories"]["nodes"]),
                              commits=c["totalCommitContributions"], reviews=c["totalPullRequestReviewContributions"],
                              contribs=c["contributionCalendar"]["totalContributions"])
              except Exception as ex:
                  print("warn: graphql", ex)
              try:
                  u = api(f"{API}/users/{USER}", tries=2, wait=5)
                  return dict(followers=u["followers"], repos=u["public_repos"])
              except Exception:
                  return {}


          # ---------------------------------------------------------------- SVG
          CRAB = ["..#.....#..", "...#...#...", "..#######..", ".##.###.##.",
                  "###########", "#.#######.#", "#.#.....#.#", "...##.##..."]
          CRAB2 = ["..#.....#..", "#..#...#..#", "#.#######.#", "###.###.###",
                   "###########", ".#########.", "..#.....#..", ".#.......#."]


          def pixels(frame, x0, y0, s, color):
              return "".join(f'<rect x="{x0 + x * s}" y="{y0 + y * s}" width="{s - 1}" height="{s - 1}" fill="{color}"/>'
                             for y, row in enumerate(frame) for x, ch in enumerate(row) if ch == "#")


          def bar_panel(title, rows, x, y, w, color):
              out = [f'<text x="{x}" y="{y}" fill="{C["mut"]}"># {xesc(title)}</text>']
              top = max((n for _, n in rows), default=1)
              lx = x + 176
              for k, (label, n) in enumerate(rows):
                  yy = y + 28 + k * 25
                  bw = max(4, int((w - (lx - x) - 44) * n / top))
                  lab = label if len(label) <= 18 else label[:17] + "…"
                  out.append(f'<text x="{x}" y="{yy}" fill="{C["fg"]}">{xesc(lab)}</text>'
                             f'<rect x="{lx}" y="{yy - 12}" width="{bw}" height="14" rx="3" fill="{color}" opacity="0.85">'
                             f'<animate attributeName="width" from="0" to="{bw}" dur="1.2s" fill="freeze"/></rect>'
                             f'<text x="{lx + bw + 8}" y="{yy}" fill="{C["mut"]}">{n}</text>')
              return "".join(out), 28 + len(rows) * 25


          def svg(s):
              """Layout verticale 540px: leggibile anche da telefono."""
              W, LH, X, VX = 540, 25, 28, 170
              body = []
              # header: invader + nome
              ps, ax, ay = 9, X, 62
              anim = lambda v: f'<animate attributeName="opacity" values="{v}" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>'
              body.append(f'<g>{anim("1;0")}{pixels(CRAB, ax, ay, ps, C["purple"])}</g>'
                          f'<g opacity="0">{anim("0;1")}{pixels(CRAB2, ax, ay, ps, C["purple"])}</g>')
              hx = X + 11 * ps + 26
              body.append(f'<text x="{hx}" y="{ay + 16}" font-weight="bold" font-size="18">'
                          f'<tspan fill="{C["green"]}">{xesc(USER)}</tspan><tspan fill="{C["fg"]}">@</tspan>'
                          f'<tspan fill="{C["yellow"]}">github</tspan></text>'
                          f'<line x1="{hx}" y1="{ay + 28}" x2="{W - X}" y2="{ay + 28}" stroke="{C["mut"]}"/>'
                          f'<text x="{hx}" y="{ay + 50}" fill="{C["mut"]}">PLAYER 1 · SCORE {s["merged"] * 100:06d}</text>')
              for k, c in enumerate(["red", "orange", "yellow", "green", "cyan", "blue", "purple", "fg"]):
                  body.append(f'<rect x="{hx + k * 26}" y="{ay + 60}" width="22" height="12" rx="2" fill="{C[c]}"/>')

              p = s["profile"]
              info = [("PRs", f"{s['total']} pubbliche", "fg"),
                      ("Merged", f"{s['merged']} ({s['rate']}% merge rate)", "green"),
                      ("Open", str(s["open"]), "cyan"),
                      ("Closed", str(s["closed"]), "red"),
                      ("Repos", f"{s['nrepos']} con contributi", "fg"),
                      ("Branches", s["branches"], "purple"),
                      ("Uptime", s["uptime"], "fg"),
                      ("Last merge", s["last_merge"], "fg"),
                      ("Oldest open", s["oldest_open"], "orange")]
              if "commits" in p:
                  info += [("Commits 1y", str(p["commits"]), "fg"), ("Reviews 1y", str(p["reviews"]), "fg"),
                           ("Contribs 1y", str(p["contribs"]), "fg")]
              if "followers" in p:
                  info.append(("Followers", f"{p['followers']}" + (f"  ★ {p['stars']}" if "stars" in p else ""), "fg"))
              y = ay + 118
              for k, v, c in info:
                  body.append(f'<text x="{X}" y="{y}" fill="{C["blue"]}" font-weight="bold">{xesc(k)}</text>'
                              f'<text x="{VX - 16}" y="{y}" fill="{C["mut"]}">:</text>'
                              f'<text x="{VX}" y="{y}" fill="{C[c]}">{xesc(v)}</text>')
                  y += LH

              y += 6
              body.append(f'<line x1="{X}" y1="{y}" x2="{W - X}" y2="{y}" stroke="{C["mut"]}" stroke-dasharray="4 4" opacity="0.6"/>')
              y += 32
              for title, rows, col in (("top repos", s["top_repos"], C["purple"]), ("pr types", s["top_kinds"], C["cyan"])):
                  g, h = bar_panel(title, rows, X, y, W - 2 * X, col)
                  body.append(g)
                  y += h + 22
              y += 8
              body.append(f'<text x="{X}" y="{y}"><tspan fill="{C["green"]}">❯ </tspan>'
                          f'<tspan fill="{C["fg"]}">git push origin main </tspan><tspan fill="{C["fg"]}">█'
                          f'<animate attributeName="opacity" values="1;0" dur="1s" calcMode="discrete" repeatCount="indefinite"/>'
                          f'</tspan></text>')
              H = y + 28
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
          <style>text{{font-family:"JetBrains Mono","Fira Code",Consolas,"DejaVu Sans Mono",monospace;font-size:15px}}</style>
          <rect width="{W}" height="{H}" rx="12" fill="{C["bg"]}"/>
          <path d="M12 0h{W - 24}a12 12 0 0 1 12 12v24h-{W}v-24a12 12 0 0 1 12-12z" fill="{C["bar"]}"/>
          <circle cx="24" cy="18" r="6" fill="#ff5f57"/><circle cx="44" cy="18" r="6" fill="#febc2e"/><circle cx="64" cy="18" r="6" fill="#28c840"/>
          <text x="{W / 2 + 20}" y="23" fill="{C["mut"]}" text-anchor="middle" font-size="13">{xesc(USER)}@github: ~ — neofetch</text>
          {"".join(body)}
          </svg>'''


          # ---------------------------------------------------------------- README
          def md(t):
              return t.replace("|", "\\|").replace("[", "\\[").replace("]", "\\]").replace("<", "&lt;")


          def ver(p):
              v = p["branch"] or p["ver"]
              return f"`{v}`" if v else "–"


          def kind_cell(p):
              return f'{KINDS.get(p["kind"], "🔹")} `{p["kind"] or "PR"}`'


          def rate_bar(m, c):
              done = m + c
              if not done:
                  return "`░░░░░░░░` –"
              r = m / done
              return f"`{'█' * round(r * 8)}{'░' * (8 - round(r * 8))}` {round(r * 100)}%"


          def repo_rows(rows, grand):
              return [f"| [`{r}`](https://github.com/{r}) | **{t}** <sub>{round(100 * t / grand)}%</sub> | {m} | {o} | {c} "
                      f"| {rate_bar(m, c)} |" for r, t, m, o, c in rows]


          def repo_table(stats):
              head = ["| Repo | PR | ✅ | 🟢 | ❌ | Merge rate |", "|---|:-:|:-:|:-:|:-:|---|"]
              T = [sum(x[i] for x in stats) for i in range(1, 5)]
              total = f"| **Σ totale** | **{T[0]}** | **{T[1]}** | **{T[2]}** | **{T[3]}** | {rate_bar(T[1], T[3])} |"
              o = ["## `❯ gh pr stats --group-by repo`", ""] + head + repo_rows(stats[:10], max(1, T[0])) + [total]
              if len(stats) > 10:
                  o += ["", f"<details><summary>📂 altri {len(stats) - 10} repository</summary>", ""] + head + \
                       repo_rows(stats[10:], max(1, T[0])) + ["", "</details>"]
              o += ["", "<sub>PR: totale e % sul totale · ✅ merged · 🟢 open · ❌ closed senza merge · merge rate = merged / (merged + closed)</sub>", ""]
              return o


          def branch_table(stats):
              grand = max(1, sum(x[1] for x in stats))
              head = ["| Branch | PR | ✅ | 🟢 | ❌ | Merge rate |", "|---|:-:|:-:|:-:|:-:|---|"]
              o = ["## `❯ gh pr stats --group-by branch`", ""] + head
              for b, t, m, op, c, _ in stats:
                  o.append(f"| 🌿 `{b}` | **{t}** <sub>{round(100 * t / grand)}%</sub> | {m} | {op} | {c} | {rate_bar(m, c)} |")
              o += ["", "<details><summary>🔍 dettaglio per branch → repository</summary>", ""]
              for b, t, m, op, c, repos in stats:
                  o += [f"#### 🌿 `{b}` · {t} PR · ✅ {m} · 🟢 {op} · ❌ {c}", "",
                        "| Repo | PR | ✅ | 🟢 | ❌ | Merge rate |", "|---|:-:|:-:|:-:|:-:|---|"]
                  o += repo_rows(repos, max(1, t)) + [""]
              o += ["</details>", "", "<sub>branch = branch target della PR · % = quota sul totale (nel dettaglio: sul branch)</sub>", ""]
              return o


          def readme_block(s, merged, opened):
              lines = urllib.parse.quote(";".join([
                  f"$ whoami → {USER}", f"{s['total']} pull requests and counting",
                  f"{s['merged']} merged · {s['open']} in review", "git commit -m 'fix: everything'"]), safe=";")
              badge = lambda l, v, col, logo: (f'<img src="https://img.shields.io/badge/{urllib.parse.quote(l)}-'
                                               f'{urllib.parse.quote(str(v))}-{col}?style=for-the-badge&logo={logo}'
                                               f'&logoColor=white&labelColor=1a1b26"/>')
              o = ['<div align="center">', "",
                   f'<img src="https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=600&size=22&duration=2800'
                   f'&pause=900&color=BB9AF7&center=true&vCenter=true&width=620&lines={lines}"/>', "",
                   '<img src="assets/neofetch.svg" alt="neofetch"/>', "",
                   badge("PRs", s["total"], "bb9af7", "git") + " " + badge("merged", s["merged"], "9ece6a", "github") + " " +
                   badge("open", s["open"], "7dcfff", "githubactions") + " " + badge("merge rate", f"{s['rate']}%", "e0af68", "codecov"),
                   "", "</div>", ""] + repo_table(s["repo_stats"]) + branch_table(s["branch_stats"]) + [
                   "## `❯ gh pr list --author @me --state merged -L 20`", "",
                   "| | PR | Repo | Branch | Merged |", "|:-:|---|---|:-:|---|"]
              for p in merged:
                  bot = " 🤖" if p["via"] == "bot" else ""
                  o.append(f'| {kind_cell(p)} | [{md(p["title"][:70])}]({p["url"]}) | `{p["repo"]}` | '
                           f'{ver(p)} | `{p["merged"][:10]}`{bot} |')
              if not merged:
                  o.append("| | _nessuna PR mergiata_ | | | |")
              o += ["", "## `❯ gh pr list --author @me --state open -L 20`", "",
                    "| | PR | Repo | Branch | Aperta | Età |", "|:-:|---|---|:-:|---|:-:|"]
              for p in opened:
                  d = days(p["created"])
                  heat = "🟢" if d < 30 else "🟡" if d < 90 else "🔴"
                  draft = "📝 " if p["draft"] else ""
                  o.append(f'| {kind_cell(p)} | {draft}[{md(p["title"][:70])}]({p["url"]}) | `{p["repo"]}` | '
                           f'{ver(p)} | `{p["created"][:10]}` | {heat} {d}g |')
              if not opened:
                  o.append("| | _nessuna PR aperta_ | | | | |")
              o += ["", "<sub>🤖 = mergiata da bot (es. robodoo) · 📝 = draft · età: 🟢 &lt;30g 🟡 &lt;90g 🔴 stale</sub>", "",
                    '<div align="center">', "", "<picture>",
                    '  <source media="(prefers-color-scheme: dark)" srcset="assets/snake-dark.svg"/>',
                    '  <img alt="snake" src="assets/snake.svg"/>', "</picture>", "",
                    f'<sub>⚙️ build <code>{NOW:%Y-%m-%d %H:%M} UTC</code> · generato da GitHub Actions · `exit 0`</sub>',
                    "", "</div>"]
              return "\n".join(o)


          def group_stats(prs, key):
              agg = {}
              for p in prs:
                  a = agg.setdefault(key(p), [0, 0, 0, 0])
                  a[0] += 1
                  if p["merged"]:
                      a[1] += 1
                  elif p["state"] == "open":
                      a[2] += 1
                  else:
                      a[3] += 1
              return [(k, *v) for k, v in agg.items()]


          def repo_stats(prs):
              return sorted(group_stats(prs, lambda p: p["repo"]), key=lambda x: (-x[1], -x[2], x[0]))


          def branch_of(p):
              return p["branch"] or p["ver"] or "?"


          def branch_key(b):
              """master in cima, poi versioni dalla più recente (saas-17.4 dopo 18.0, prima di 17.0)."""
              if b in ("master", "main"):
                  return (0, 0.0, b)
              m = re.search(r"(\d+)\.(\d+)", b)
              if not m:
                  return (2, 0.0, b)
              return (1, -(int(m.group(1)) + int(m.group(2)) / 100), b)


          def branch_stats(prs):
              out = []
              for b, *v in sorted(group_stats(prs, branch_of), key=lambda x: branch_key(x[0])):
                  sub = [p for p in prs if branch_of(p) == b]
                  out.append((b, *v, repo_stats(sub)))
              return out


          def main():
              prs = [parse(i) for i in search_prs()]
              enrich(prs)
              merged_all = sorted((p for p in prs if p["merged"]), key=lambda p: p["merged"], reverse=True)
              open_all = sorted((p for p in prs if p["state"] == "open"), key=lambda p: p["created"], reverse=True)
              closed = len(prs) - len(merged_all) - len(open_all)
              first = min((p["created"] for p in prs), default=NOW.isoformat())
              up = days(first)
              s = dict(total=len(prs), merged=len(merged_all), open=len(open_all), closed=closed,
                       rate=round(100 * len(merged_all) / max(1, len(merged_all) + closed)),
                       nrepos=len({p["repo"] for p in prs}),
                       uptime=f"{up // 365}y {up % 365 // 30}m · dal {first[:10]}",
                       last_merge=f"{ago(merged_all[0]['merged'])} · {merged_all[0]['repo'][:24]}" if merged_all else "–",
                       oldest_open=f"{max(days(p['created']) for p in open_all)} giorni" if open_all else "–",
                       branches=" · ".join(f"{b} ({n})" for b, n in
                                           Counter(p["branch"] or p["ver"] for p in prs if p["branch"] or p["ver"]).most_common(3)) or "–",
                       top_repos=Counter(p["repo"] for p in prs).most_common(5),
                       top_kinds=Counter(p["kind"] or "altro" for p in prs).most_common(5),
                       repo_stats=repo_stats(prs),
                       branch_stats=branch_stats(prs),
                       profile=profile())
              os.makedirs(ASSETS, exist_ok=True)
              open(f"{ASSETS}/neofetch.svg", "w", encoding="utf-8").write(svg(s))
              block = f"{START}\n{readme_block(s, merged_all[:20], open_all[:20])}\n{END}"
              text = open(README, encoding="utf-8").read() if os.path.exists(README) else ""
              if START not in text or END not in text:
                  text = text.rstrip() + f"\n\n{START}\n{END}\n"
              text = re.sub(re.escape(START) + r".*?" + re.escape(END), lambda _: block, text, flags=re.S)
              # riga vuota dopo il blocco: senza, il markdown che segue viene mostrato come testo
              text = re.sub(re.escape(END) + r"[ \t]*\n*", END + "\n\n", text)
              open(README, "w", encoding="utf-8").write(text.lstrip())
              print(f"ok: {s['total']} PR, {s['merged']} merged, {s['open']} open")


          if __name__ == "__main__":
              main()
          PYEOF

      - name: Genera snake dei contributi
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark&color_snake=#bb9af7

      - name: Commit se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || (git commit -m "chore: aggiorna README [skip ci]" && git push)
